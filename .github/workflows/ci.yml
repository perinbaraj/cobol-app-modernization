# CI — Build, Test, and Lint
# Fixes README badge: https://github.com/acme-corp/cobol-app-modernization/actions/workflows/ci.yml
#
# Jobs:
#   build-java   — compiles and tests the Java 17 Spring Boot sample (CUSTMGMT migration)
#   lint-react   — TypeScript type-checks the React 18.2 BMS-to-React sample
#   validate-metadata — validates MCP server JSON metadata on every push

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1: Compile and test the migrated Java service
  # Mirrors: CUSTMGMT.cbl → CustomerService.java
  # ──────────────────────────────────────────────────────────────
  build-java:
    name: Build & Test Java (CUSTMGMT migration)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build and run tests
        working-directory: samples/expected-output/java
        run: mvn --batch-mode --no-transfer-progress test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: samples/expected-output/java/target/surefire-reports/
          retention-days: 7

      - name: Summarise test results
        if: always()
        run: |
          echo "## Java Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -d "samples/expected-output/java/target/surefire-reports" ]; then
            PASSED=$(grep -rh 'tests=' samples/expected-output/java/target/surefire-reports/ 2>/dev/null \
              | grep -oP 'tests="\K[0-9]+' | awk '{s+=$1} END {print s+0}')
            FAILED=$(grep -rh 'failures=' samples/expected-output/java/target/surefire-reports/ 2>/dev/null \
              | grep -oP 'failures="\K[0-9]+' | awk '{s+=$1} END {print s+0}')
            ERRORS=$(grep -rh 'errors=' samples/expected-output/java/target/surefire-reports/ 2>/dev/null \
              | grep -oP 'errors="\K[0-9]+' | awk '{s+=$1} END {print s+0}')
            echo "- Tests run: $PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- Failures:  $FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- Errors:    $ERRORS" >> $GITHUB_STEP_SUMMARY
          else
            echo "No surefire reports found." >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────
  # Job 2: TypeScript type-check the React BMS migration sample
  # Mirrors: CUSTINQ.bms → CustomerInquiry.tsx
  # ──────────────────────────────────────────────────────────────
  lint-react:
    name: Lint & Type-check React (CUSTINQ migration)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: samples/expected-output/react/package-lock.json

      - name: Install dependencies
        working-directory: samples/expected-output/react
        run: npm ci --prefer-offline

      - name: TypeScript type-check
        working-directory: samples/expected-output/react
        run: npx tsc --noEmit

      - name: Build (verify no bundle errors)
        working-directory: samples/expected-output/react
        run: npm run build

  # ──────────────────────────────────────────────────────────────
  # Job 3: Validate MCP metadata JSON files
  # Runs on every push (not just data/*.json changes)
  # ──────────────────────────────────────────────────────────────
  validate-metadata:
    name: Validate MCP Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: mcp-servers/mainframe-context/package.json

      - name: Install MCP server dependencies
        working-directory: mcp-servers/mainframe-context
        run: npm ci

      - name: Validate JSON syntax
        run: |
          echo "## JSON Syntax Validation" >> $GITHUB_STEP_SUMMARY
          ERRORS=0
          for file in data/*.json; do
            if [ -f "$file" ]; then
              if jq empty "$file" 2>/dev/null; then
                echo "✅ $file" >> $GITHUB_STEP_SUMMARY
              else
                echo "❌ $file — invalid JSON" >> $GITHUB_STEP_SUMMARY
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "**$ERRORS file(s) failed JSON validation**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run MCP schema validation
        working-directory: mcp-servers/mainframe-context
        run: |
          if npm run --silent validate 2>/dev/null; then
            echo "✅ All metadata files pass schema validation" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Schema validation skipped (no validate script)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Summarise metadata counts
        run: |
          echo "## Metadata Summary" >> $GITHUB_STEP_SUMMARY
          for file in data/program-inventory.json data/copybook-catalog.json data/jcl-catalog.json data/data-dictionary.json; do
            if [ -f "$file" ]; then
              KEY=$(basename "$file" .json | tr '-' '_')
              COUNT=$(jq '[.[]] | length' "$file" 2>/dev/null || echo "?")
              echo "- \`$file\`: $COUNT entries" >> $GITHUB_STEP_SUMMARY
            fi
          done
