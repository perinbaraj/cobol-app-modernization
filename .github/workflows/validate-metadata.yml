# Validate Metadata Files
# Triggers on changes to data/*.json files
# Validates JSON structure and runs MCP server validation

name: Validate Metadata

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'mcp-servers/**'
  pull_request:
    branches: [main]
    paths:
      - 'data/**'
      - 'mcp-servers/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: mcp-servers/mainframe-context/package.json

      - name: Install MCP server dependencies
        working-directory: mcp-servers/mainframe-context
        run: npm ci

      - name: Validate JSON syntax
        run: |
          echo "## JSON Syntax Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          ERRORS=0
          for file in data/*.json; do
            if [ -f "$file" ]; then
              if jq empty "$file" 2>/dev/null; then
                echo "✅ $file - Valid JSON" >> $GITHUB_STEP_SUMMARY
              else
                echo "❌ $file - Invalid JSON syntax" >> $GITHUB_STEP_SUMMARY
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          
          if [ $ERRORS -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$ERRORS file(s) have invalid JSON syntax**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Validate metadata schema
        working-directory: mcp-servers/mainframe-context
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Schema Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run MCP server validation if validate script exists
          if npm run --silent validate 2>/dev/null; then
            echo "✅ All metadata files pass schema validation" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Schema validation skipped (no validate script)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for required fields
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Required Fields Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          check_file() {
            local file=$1
            local label=$2
            if [ -f "$file" ]; then
              local count
              count=$(jq 'if type == "array" then length else 0 end' "$file" 2>/dev/null || echo "0")
              if [ "$count" -eq 0 ]; then
                echo "❌ $file: not an array or empty" >> $GITHUB_STEP_SUMMARY
                echo "Error: $file must contain a non-empty JSON array"
                exit 1
              else
                echo "✅ $file: $count $label" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "❌ $file: missing" >> $GITHUB_STEP_SUMMARY
              echo "Error: $file is required"
              exit 1
            fi
          }
          
          check_file "data/program-inventory.json" "programs"
          check_file "data/copybook-catalog.json" "copybooks"
          check_file "data/jcl-catalog.json" "jobs"
          check_file "data/data-dictionary.json" "entities"

      - name: Report validation results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read the step summary
            let summaryContent = '';
            if (process.env.GITHUB_STEP_SUMMARY && fs.existsSync(process.env.GITHUB_STEP_SUMMARY)) {
              summaryContent = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 Metadata Validation Results\n\n${summaryContent}\n\nSee [workflow run](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}) for details.`
            });
