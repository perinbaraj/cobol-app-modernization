version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/mcp-servers/mainframe-context"
    schedule:
      interval: "weekly"
    groups:
      minor-patch-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/samples/expected-output/react"
    schedule:
      interval: "weekly"
    groups:
      minor-patch-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "maven"
    directory: "/samples/expected-output/java"
    schedule:
      interval: "weekly"
    groups:
      minor-patch-updates:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch-updates:
        update-types:
          - "minor"
          - "patch"